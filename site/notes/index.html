<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120c2e">
  <meta name="robots" content="noindex">
  <title>Notes de mise à jour</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="notes.css">
  <script type="module" src="notes.js"></script>
</head>
<body>
  <header class="top">
    <a class="back" href="/" aria-label="Retour aux jeux">‹ Les jeux</a>
    <h1>Notes de mise à jour <span aria-hidden="true">📜</span></h1>
    <p class="sub">Toutes les versions, de gauche (les plus anciennes) à droite (les plus récentes). Glisse pour te déplacer, touche une carte pour lire.</p>
  </header>
  <main>
    <div id="fresco" class="fresco" tabindex="0" aria-label="Frise des mises à jour"><p class="loading">Chargement…</p></div>
  </main>
  <aside id="reader" class="reader" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="reader-title">
      <button class="close" type="button" aria-label="Fermer">✕</button>
      <p id="reader-meta" class="meta"></p>
      <h2 id="reader-title"></h2>
      <div id="reader-body" class="body"></div>
    </div>
  </aside>
</body>
</html>
